<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1e1e1e; background: #fff; }
    .header { border-bottom: 1px solid #e5e5e5; background: #fff; }
    .header__inner { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; max-width: 1200px; margin: 0 auto; }
    .header__logo { font-size: 1.25rem; font-weight: 600; }
    .header__nav { display: flex; gap: 1.5rem; }
    .header__link { text-decoration: none; color: inherit; }
    .header__link:hover { opacity: 0.8; }
    .content { padding: 2rem; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 1rem; }
    h2 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { margin-bottom: 1rem; }
    .button { display: inline-block; padding: 0.5rem 1rem; background: #1e1e1e; color: #fff; text-decoration: none; border-radius: 0.25rem; }
    .button:hover { opacity: 0.9; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
    th, td { border: 1px solid #e5e5e5; padding: 0.5rem 1rem; text-align: left; }
    th { background: #f5f5f5; }
    .image-placeholder { background: #f5f5f5; height: 12rem; display: flex; align-items: center; justify-content: center; color: #666; border-radius: 0.25rem; }
  </style>
</head>
<body>
  <div class="content">
  <header class="header">
    <div class="header__inner">
      <div class="header__logo">My Website</div>
      <nav class="header__nav">
        <a href="/" class="header__link">My Website</a>
        <a href="/about" class="header__link">About</a>
        <a href="/contact" class="header__link">Contact</a>
      </nav>
    </div>
  </header>
    <h1></h1>
    <h1>asdfdasfdasf</h1>
  </div>
</body>
</html>
