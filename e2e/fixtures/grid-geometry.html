<!doctype html><html><head><meta charset="utf-8"><title>Grid geometry</title>
<style>
  body { margin: 0; padding: 40px; }
  section { margin-bottom: 40px; display: flex; gap: 40px; align-items: flex-start; }
  /* A component library's own button: 40px high with its own padding and margins. */
  .library-button { display: inline-flex; align-items: center; height: 40px; min-height: 40px; padding: 12px 16px; margin: 4px 0; line-height: 24px; border: 0; background: none; font: inherit; }
  #danger-probe { color: var(--ds-danger-color); }
</style>
<script type="module">
  import '/DS1/1-root/one.css';
  import '/DS1/1-root/component-tokens.css';
  import '/DS1/1-root/controls.css';
  import loading from '/DS1/2-core/styles/ds-loading.css?inline';
  import '/DS1/2-core/ds-button.ts';
  import '/DS1/2-core/ds-loading.ts';
  import '/DS1/2-core/ds-avatar.ts';
  import '/DS1/3-unit/ds-menu.ts';
  const style = document.createElement('style'); style.textContent = loading; document.head.append(style);
  window.ready = customElements.whenDefined('ds-menu').then(() => Promise.all([...document.querySelectorAll('ds-button, ds-menu, ds-loading, ds-avatar')].map(element => element.updateComplete)));
</script></head>
<body>
<section>
  <ds-menu id="element" role="menu">
    <ds-button role="menuitem">Rename</ds-button>
    <ds-button role="menuitem">Duplicate</ds-button>
    <hr data-ds-menu-separator>
    <ds-button role="menuitem" danger>Delete</ds-button>
  </ds-menu>
  <ds-menu id="library" role="menu">
    <button class="library-button" role="menuitem">Edit</button>
    <button class="library-button" role="menuitem">Move</button>
    <a class="library-button" role="menuitem" href="#">Open</a>
  </ds-menu>
  <ds-menu id="compact" compact role="menu">
    <ds-button role="menuitem">One</ds-button>
    <ds-button role="menuitem">Two</ds-button>
    <ds-button role="menuitem">Three</ds-button>
  </ds-menu>
  <div id="native" class="ds-menu" role="menu">
    <div class="ds-menu__label">Page</div>
    <div class="ds-menu__item" role="menuitem">Rename</div>
    <div class="ds-menu__separator" role="separator"></div>
    <div role="group">
      <button class="library-button" role="menuitem">Edit</button>
      <button class="ds-menu__item" role="menuitem">Copy</button>
    </div>
    <div class="ds-menu__item" role="menuitem" data-variant="destructive">Delete</div>
  </div>
</section>
<section>
  <ds-button id="anchor" secondary>Open the menu</ds-button>
  <ds-menu id="floating" floating role="menu">
    <ds-button role="menuitem">First</ds-button>
    <ds-button role="menuitem">Second</ds-button>
  </ds-menu>
</section>
<section>
  <ds-button id="spinner-element" secondary><ds-loading variant="spinner"></ds-loading>Saving</ds-button>
  <button id="spinner-native" class="ds-button ds-button--secondary"><span class="ds-loading" data-variant="spinner" aria-hidden="true"><span class="ds-loading__fill"></span></span>Saving</button>
  <ds-loading id="spinner-alone" variant="spinner"></ds-loading>
  <span id="spinner-alone-markup" class="ds-loading" data-variant="spinner"><span class="ds-loading__fill"></span></span>
</section>
<section>
  <ds-button id="danger">Delete</ds-button>
  <ds-button id="danger-secondary" secondary danger>Delete</ds-button>
  <ds-button id="plain">Keep</ds-button>
  <span id="danger-probe">probe</span>
  <ds-avatar id="avatar" icon="avatar"></ds-avatar>
</section>
</body></html>
